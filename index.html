
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Min iu Bích ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<canvas id="heartCanvas"></canvas>

<script>
const canvas = document.getElementById("heartCanvas");
const ctx = canvas.getContext("2d");

let width, height;
let particles = [];
let orbitHearts = [];
let floatingHearts = [];

const COLORS = [
    "#ff69b4",
    "#ff85c8",
    "#ffb6dc",
    "#ec75b4",
    "#ff1493",
    "#e754a6"
];

// Kích thước màn hình
function resize() {
    const dpr = window.devicePixelRatio || 1;

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    createHeart();
}

// Công thức tạo hình trái tim
function heartPoint(t, scale) {
    const x = 16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return {
        x: width / 2 + x * scale,
        y: height / 2 - y * scale
    };
}

// Vẽ một trái tim
function drawHeart(x, y, size, color, alpha = 1) {
    ctx.save();

    ctx.translate(x, y);
    ctx.scale(size / 10, size / 10);

    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;

    ctx.beginPath();
    ctx.moveTo(0, 4);
    ctx.bezierCurveTo(-10, -4, -10, -12, 0, -6);
    ctx.bezierCurveTo(10, -12, 10, -4, 0, 4);
    ctx.fill();

    ctx.restore();
}

// Hạt tạo thành viền trái tim lớn
class HeartParticle {
    constructor(t, scale, size) {
        this.t = t;
        this.scale = scale;
        this.size = size;

        this.offset = (Math.random() - 0.5) * 12;
        this.speed = (Math.random() - 0.5) * 0.0005;

        this.alpha = 0.4 + Math.random() * 0.6;
        this.color = COLORS[
            Math.floor(Math.random() * COLORS.length)
        ];
    }

    draw(time) {
        const p = heartPoint(
            this.t + Math.sin(time * 0.001 + this.t) * 0.006,
            this.scale
        );

        const x = p.x + this.offset;
        const y = p.y + this.offset;

        const pulse =
            1 + Math.sin(time * 0.003 + this.t) * 0.15;

        drawHeart(
            x,
            y,
            this.size * pulse,
            this.color,
            this.alpha
        );

        this.t += this.speed;
    }
}

// Trái tim xoay quanh bên ngoài
function createOrbitHearts() {
    orbitHearts = [];

    for (let i = 0; i < 250; i++) {
        orbitHearts.push({
            angle: Math.random() * Math.PI * 2,

            radius: 1.05 + Math.random() * 0.7,

            speed: (0.001 + Math.random() * 0.003) *
                (Math.random() > 0.5 ? 1 : -1),

            size: 4 + Math.random() * 12,

            alpha: 0.4 + Math.random() * 0.6,

            color: COLORS[
                Math.floor(Math.random() * COLORS.length)
            ]
        });
    }
}

// Vẽ trái tim xoay
function drawOrbitHearts(time) {
    const scale = Math.min(width / 42, height / 35);

    orbitHearts.forEach(h => {
        h.angle += h.speed;

        const x = width / 2 +
            Math.cos(h.angle) * scale * 21 * h.radius;

        const y = height / 2 +
            Math.sin(h.angle) * scale * 17 * h.radius;

        const pulse =
            1 + Math.sin(time * 0.005 + h.angle) * 0.2;

        ctx.save();

        ctx.shadowColor = "#ff69b4";
        ctx.shadowBlur = 15;

        drawHeart(
            x,
            y,
            h.size * pulse,
            h.color,
            h.alpha
        );

        ctx.restore();
    });
}

// Trái tim bay tự do
function createFloatingHearts() {
    floatingHearts = [];

    for (let i = 0; i < 70; i++) {
        floatingHearts.push({
            x: Math.random() * width,
            y: Math.random() * height,

            size: 3 + Math.random() * 9,

            speed: 0.2 + Math.random() * 0.8,

            drift: (Math.random() - 0.5) * 0.5,

            alpha: 0.3 + Math.random() * 0.6,

            color: COLORS[
                Math.floor(Math.random() * COLORS.length)
            ]
        });
    }
}

// Hiệu ứng trái tim bay lên
function drawFloatingHearts() {
    floatingHearts.forEach(h => {
        h.y -= h.speed;
        h.x += h.drift;

        if (h.y < -20) {
            h.y = height + 20;
            h.x = Math.random() * width;
        }

        if (h.x < -20) h.x = width + 20;
        if (h.x > width + 20) h.x = -20;

        drawHeart(
            h.x,
            h.y,
            h.size,
            h.color,
            h.alpha
        );
    });
}

// Tạo tất cả hiệu ứng
function createHeart() {
    particles = [];

    const scale = Math.min(width / 42, height / 35);

    // Viền trái tim ngoài
    for (let i = 0; i < 350; i++) {
        const t = Math.random() * Math.PI * 2;

        particles.push(
            new HeartParticle(
                t,
                scale,
                5 + Math.random() * 12
            )
        );
    }

    // Viền trái tim phía trong
    for (let i = 0; i < 200; i++) {
        const t = Math.random() * Math.PI * 2;

        particles.push(
            new HeartParticle(
                t,
                scale * (0.78 + Math.random() * 0.18),
                3 + Math.random() * 7
            )
        );
    }

    createOrbitHearts();
    createFloatingHearts();
}

// Hiệu ứng chữ giữa trái tim
function drawText(time) {
    ctx.save();

    ctx.translate(width / 2, height / 2);

    const pulse =
        1 + Math.sin(time * 0.003) * 0.08;

    ctx.scale(pulse, pulse);

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    // Chữ chính
    ctx.font = "bold 38px Arial";

    ctx.fillStyle = "#ff8acb";

    ctx.shadowColor = "#ff1493";
    ctx.shadowBlur = 25;

    ctx.fillText("Min iu Bích", 0, 0);

    // Trái tim nhỏ dưới chữ
    ctx.font = "25px Arial";
    ctx.fillText("♥ ♥ ♥", 0, 45);

    ctx.restore();
}

// Vòng lặp animation
function animate(time) {
    ctx.clearRect(0, 0, width, height);

    // Trái tim bay tự do
    drawFloatingHearts();

    // Trái tim xoay xung quanh
    drawOrbitHearts(time);

    // Trái tim tạo viền
    particles.forEach(p => p.draw(time));

    // Chữ ở chính giữa
    drawText(time);

    requestAnimationFrame(animate);
}

// Khởi chạy
window.addEventListener("resize", resize);

resize();

requestAnimationFrame(animate);

</script>

</body>
</html>
