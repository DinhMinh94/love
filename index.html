
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pink Heart Animation</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: #000;
        overflow: hidden;
    }

    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
    }
</style>
</head>

<body>
<canvas id="heartCanvas"></canvas>

<script>
const canvas = document.getElementById("heartCanvas");
const ctx = canvas.getContext("2d");

let width, height;
let particles = [];

function resize() {
    const dpr = window.devicePixelRatio || 1;
    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    createHeart();
}

// Công thức tạo hình trái tim
function heartPoint(t, scale) {
    const x = 16 * Math.pow(Math.sin(t), 3);

    const y = 13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return {
        x: width / 2 + x * scale,
        y: height / 2 - y * scale
    };
}

// Tạo hạt trái tim
class HeartParticle {
    constructor(t, scale, size) {
        this.t = t;
        this.scale = scale;
        this.size = size;

        this.offset = (Math.random() - 0.5) * 15;
        this.speed = (Math.random() - 0.5) * 0.0015;

        this.alpha = 0.3 + Math.random() * 0.7;
        this.color = Math.random() > 0.5
            ? "#ec75b4"
            : "#f49acb";
    }

    draw(time) {
        const p = heartPoint(
            this.t + Math.sin(time * 0.001 + this.t) * 0.008,
            this.scale
        );

        const x = p.x + this.offset;
        const y = p.y + this.offset;

        ctx.save();
        ctx.translate(x, y);

        const pulse = 1 + Math.sin(time * 0.003 + this.t) * 0.12;
        ctx.scale(this.size * pulse, this.size * pulse);

        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;

        // Vẽ trái tim nhỏ
        ctx.beginPath();
        ctx.moveTo(0, 3);
        ctx.bezierCurveTo(-8, -4, -8, -10, 0, -6);
        ctx.bezierCurveTo(8, -10, 8, -4, 0, 3);
        ctx.fill();

        ctx.restore();

        this.t += this.speed;
    }
}

// Khởi tạo các hạt
function createHeart() {
    particles = [];

    const scale = Math.min(width / 42, height / 35);

    // Hạt lớn tạo viền trái tim
    for (let i = 0; i < 220; i++) {
        const t = Math.random() * Math.PI * 2;

        particles.push(
            new HeartParticle(
                t,
                scale,
                0.5 + Math.random() * 0.9
            )
        );
    }

    // Hạt nhỏ tạo viền bên trong
    for (let i = 0; i < 150; i++) {
        const t = Math.random() * Math.PI * 2;

        particles.push(
            new HeartParticle(
                t,
                scale * (0.78 + Math.random() * 0.18),
                0.2 + Math.random() * 0.5
            )
        );
    }
}

// Vòng lặp animation

function animate(time) {
    ctx.clearRect(0, 0, width, height);

    particles.forEach(p => p.draw(time));

    // Chữ ở giữa trái tim
    ctx.save();

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    const pulse = 1 + Math.sin(time * 0.003) * 0.08;

    ctx.translate(width / 2, height / 2);
    ctx.scale(pulse, pulse);

    ctx.font = "bold 38px Arial";
    ctx.fillStyle = "#ff8acb";

    ctx.shadowColor = "#ff1493";
    ctx.shadowBlur = 25;

    ctx.fillText("Min iu Bích", 0, 0);

    ctx.restore();

    requestAnimationFrame(animate);
}


window.addEventListener("resize", resize);

resize();
requestAnimationFrame(animate);

</script>
</body>
</html>
